name: Publish @nexryai/element-call-embedded

on:
  release:
    types: [published]
  push:
    branches: [livekit]

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node (pnpm cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile

      - name: Build
        run: pnpm build:full:production
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Copy dist to embedded/web
        run: cp -r dist embedded/web/dist

      - name: Setup node (npm registry)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Publish
        working-directory: embedded/web
        run: npm publish --provenance --access public
